<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="70mm" viewBox="0 0 400 280">
  <rect x="0" y="0" width="400" height="280" fill="#FFFFFF"/>
  <rect x="4" y="4" width="392" height="272" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- Corner fiducials -->
  <g fill="#000000">
    <rect x="16" y="16" width="36" height="36"/>
    <rect x="348" y="16" width="36" height="36"/>
    <rect x="16" y="228" width="36" height="36"/>
    <rect x="348" y="228" width="36" height="36"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="27" y="27" width="14" height="14"/>
    <rect x="359" y="27" width="14" height="14"/>
    <rect x="27" y="239" width="14" height="14"/>
    <rect x="359" y="239" width="14" height="14"/>
  </g>
  <!-- Greyscale reference ramp -->
  <g stroke="#000000" stroke-width="1">
    <rect x="70" y="24" width="42" height="42" fill="#FFFFFF"/>
    <rect x="116" y="24" width="42" height="42" fill="#D9D9D9"/>
    <rect x="162" y="24" width="42" height="42" fill="#B3B3B3"/>
    <rect x="208" y="24" width="42" height="42" fill="#808080"/>
    <rect x="254" y="24" width="42" height="42" fill="#4D4D4D"/>
    <rect x="300" y="24" width="42" height="42" fill="#000000"/>
  </g>
  <!-- Labels -->
  <text x="200" y="118" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#000000">AURAPPH CALIBRATION CARD</text>
  <text x="200" y="142" text-anchor="middle" font-family="monospace" font-size="11" fill="#000000">VERSION 1 · SPEC V0.1 · PROTOTYPE — NOT A CLINICAL TOOL</text>
  <text x="200" y="166" text-anchor="middle" font-family="monospace" font-size="11" fill="#000000">PRINT AT 100% — DO NOT SCALE · LAMINATE MATTE</text>
  <text x="200" y="188" text-anchor="middle" font-family="monospace" font-size="11" fill="#000000">PLACE BESIDE THE PAD, SAME PLANE, FULLY IN FRAME</text>
  <!-- Millimetre ruler: 4 units = 1 mm at 100% print (400 units = 100 mm) -->
  <g stroke="#000000">
    <line x1="30" y1="216" x2="370" y2="216" stroke-width="1.5"/>
  </g>
  <g stroke="#000000" stroke-width="1">
    <line x1="30" y1="216" x2="30" y2="228"/>
    <line x1="70" y1="216" x2="70" y2="228"/>
    <line x1="110" y1="216" x2="110" y2="228"/>
    <line x1="150" y1="216" x2="150" y2="228"/>
    <line x1="190" y1="216" x2="190" y2="228"/>
    <line x1="230" y1="216" x2="230" y2="228"/>
    <line x1="270" y1="216" x2="270" y2="228"/>
    <line x1="310" y1="216" x2="310" y2="228"/>
    <line x1="350" y1="216" x2="350" y2="228"/>
  </g>
  <g font-family="monospace" font-size="10" fill="#000000" text-anchor="middle">
    <text x="30" y="242">0</text>
    <text x="70" y="242">10</text>
    <text x="110" y="242">20</text>
    <text x="150" y="242">30</text>
    <text x="190" y="242">40</text>
    <text x="230" y="242">50</text>
    <text x="270" y="242">60</text>
    <text x="310" y="242">70</text>
    <text x="350" y="242">80</text>
  </g>
  <text x="200" y="264" text-anchor="middle" font-family="monospace" font-size="9" fill="#000000">VERIFY BEFORE USE: THE RULER ABOVE MUST MEASURE TRUE MILLIMETRES</text>
</svg>
